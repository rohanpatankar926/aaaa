[project]
name = "app"
version = "0.1.0"
description = "Sample FastAPI project demonstrating streaming responses from a LangGraph graph."
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "langgraph>=0.2.20",
    "langchain>=0.2.12",
    "langchain-openai>=0.1.17",
    "python-dotenv>=1.0.1",
    "ruff>=0.14.7",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "ipython>=8.37.0",
]

[tool.uv]
package = true

[tool.poetry]
name = "fastapi-langgraph-sample"
version = "0.1.0"
description = "Sample FastAPI project demonstrating streaming responses from a LangGraph graph."
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
langgraph = "^0.2.20"
langchain = "^0.2.12"
langchain-openai = "^0.1.17"
python-dotenv = "^1.0.1"
pandas = "^2.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

